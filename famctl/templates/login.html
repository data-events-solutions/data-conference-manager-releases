<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FamCtl - دخول</title>
<style>
body{font-family:system-ui,Tahoma,sans-serif;background:#f4f6f8;display:grid;place-items:center;min-height:100vh;margin:0}
form{background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 12px #0001;width:min(320px,90vw)}
input,button{width:100%;padding:10px;margin-top:10px;font-size:16px;box-sizing:border-box}
button{background:#2563eb;color:#fff;border:0;border-radius:8px}.err{color:#b91c1c}
</style>
</head>
<body>
<form method="post">
  <h2>لوحة تحكم الشبكة</h2>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <input type="password" name="password" placeholder="كلمة السر" autofocus required>
  <button>دخول</button>
</form>
</body>
</html>
